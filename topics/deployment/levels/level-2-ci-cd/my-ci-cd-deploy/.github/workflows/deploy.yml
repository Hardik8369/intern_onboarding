name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with commit hash
        run: |
          docker build \
            --build-arg COMMIT_HASH=${{ github.sha }} \
            -t ci-cd-app:${{ github.sha }} \
            .

      - name: Verify Docker image works
        run: |
          docker run -d -p 5000:5000 \
            --name test-app \
            ci-cd-app:${{ github.sha }}
          sleep 3
          curl -s http://localhost:5000/health
          curl -s http://localhost:5000/version
          docker stop test-app
          docker rm test-app

      - name: Deploy complete
        run: echo "Build verified! Railway auto-deploys from GitHub push."
